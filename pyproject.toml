[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sciforge-edu"
version = "0.1.0"
description = "Educational Question Asset Management and Exam Generation System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic"
]

[project.optional-dependencies]
dev = [
    "pytest"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]